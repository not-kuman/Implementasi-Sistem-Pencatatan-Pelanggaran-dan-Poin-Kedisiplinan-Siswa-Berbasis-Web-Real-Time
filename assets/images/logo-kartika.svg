<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172B3A" />
      <stop offset="100%" stop-color="#0F1C26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D6A34D" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CA39D" />
      <stop offset="100%" stop-color="#397C78" />
    </linearGradient>
  </defs>

  <!-- Outer Pentagon Shield -->
  <path d="M 60 8 L 106 24 C 106 65, 88 98, 60 114 C 32 98, 14 65, 14 24 Z" 
        fill="url(#shieldGrad)" stroke="#E5C07B" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Inner Border Line -->
  <path d="M 60 15 L 100 29 C 100 64, 84 92, 60 106 C 36 92, 20 64, 20 29 Z" 
        fill="none" stroke="#E5C07B" stroke-width="1" stroke-opacity="0.4" stroke-linejoin="round"/>

  <!-- Golden Kartika 5-Point Star -->
  <polygon points="60,26 63.8,36.5 75,36.5 66,43.2 69.4,54 60,47.5 50.6,54 54,43.2 45,36.5 56.2,36.5" 
           fill="url(#goldGrad)" />

  <!-- Torch / Flame of Discipline & Wisdom -->
  <path d="M 60 52 C 57 56, 55 60, 56 63 C 57 66, 60 67, 60 67 C 60 67, 63 66, 64 63 C 65 60, 63 56, 60 52 Z" 
        fill="#E5C07B"/>
  <path d="M 58 67 L 62 67 L 61 74 L 59 74 Z" fill="#64748B"/>

  <!-- Open Book of Knowledge -->
  <path d="M 38 78 Q 49 75, 60 78 Q 71 75, 82 78 L 84 86 Q 71 83, 60 86 Q 49 83, 36 86 Z" 
        fill="url(#tealGrad)" stroke="#E5C07B" stroke-width="1.2"/>
  <line x1="60" y1="78" x2="60" y2="86" stroke="#E5C07B" stroke-width="1.5"/>

  <!-- Academic Ribbons / Laurel Leaves -->
  <path d="M 32 48 C 30 58, 33 68, 38 76" fill="none" stroke="#D6A34D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 88 48 C 90 58, 87 68, 82 76" fill="none" stroke="#D6A34D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Text / Monogram -->
  <text x="60" y="99" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="0.5">SMA KARTIKA 1-2</text>
  <text x="60" y="108" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="6.5" fill="#D6A34D" letter-spacing="1.5">MEDAN</text>
</svg>
