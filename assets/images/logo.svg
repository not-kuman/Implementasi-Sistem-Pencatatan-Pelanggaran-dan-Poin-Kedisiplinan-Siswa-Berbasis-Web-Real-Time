<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172B3A" />
      <stop offset="100%" stop-color="#0F1C26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D6A34D" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CA39D" />
      <stop offset="100%" stop-color="#397C78" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 60 8 L 106 24 C 106 65, 88 98, 60 114 C 32 98, 14 65, 14 24 Z" 
        fill="url(#shieldGrad)" stroke="#397C78" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Subtle Inner Border -->
  <path d="M 60 15 L 100 29 C 100 64, 84 92, 60 106 C 36 92, 20 64, 20 29 Z" 
        fill="none" stroke="#E5C07B" stroke-width="1" stroke-opacity="0.3" stroke-linejoin="round"/>

  <!-- Scale of Discipline / Justice Beam -->
  <line x1="60" y1="28" x2="60" y2="60" stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="36" x2="82" y2="36" stroke="#E5C07B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="28" r="3" fill="#D6A34D"/>

  <!-- Left Scale Pan -->
  <line x1="42" y1="36" x2="35" y2="48" stroke="#64748B" stroke-width="1.2"/>
  <line x1="42" y1="36" x2="49" y2="48" stroke="#64748B" stroke-width="1.2"/>
  <path d="M 33 48 Q 42 54 51 48 Z" fill="#397C78" stroke="#E5C07B" stroke-width="1"/>

  <!-- Right Scale Pan -->
  <line x1="78" y1="36" x2="71" y2="48" stroke="#64748B" stroke-width="1.2"/>
  <line x1="78" y1="36" x2="85" y2="48" stroke="#64748B" stroke-width="1.2"/>
  <path d="M 69 48 Q 78 54 87 48 Z" fill="#397C78" stroke="#E5C07B" stroke-width="1"/>

  <!-- Open Record Book / Code of Conduct -->
  <path d="M 36 68 Q 48 64, 60 67 Q 72 64, 84 68 L 86 78 Q 72 74, 60 77 Q 48 74, 34 78 Z" 
        fill="url(#tealGrad)" stroke="#E5C07B" stroke-width="1.2"/>
  <line x1="60" y1="67" x2="60" y2="77" stroke="#E5C07B" stroke-width="1.5"/>

  <!-- Clean Administrative Monogram -->
  <text x="60" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="1">KEDISIPLINAN</text>
  <text x="60" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="6.5" fill="#D6A34D" letter-spacing="2">SISWA</text>
</svg>