services:
  - type: web
    name: sim-kedisiplinan-kartika
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: db-kartika
          property: host
      - key: DB_USER
        fromDatabase:
          name: db-kartika
          property: user
      - key: DB_PASS
        fromDatabase:
          name: db-kartika
          property: password
      - key: DB_NAME
        fromDatabase:
          name: db-kartika
          property: database
      - key: DB_PORT
        fromDatabase:
          name: db-kartika
          property: port

databases:
  - name: db-kartika
    plan: free
    databaseName: db_kartika_disiplin
    user: root
